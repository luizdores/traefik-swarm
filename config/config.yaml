global:
  checkNewVersion: false
  sendAnonymousUsage: false
serversTransport:
  insecureSkipVerify: true
providers:
  docker:
    endpoint: 'unix:///var/run/docker.sock'
    exposedByDefault: false
    constraints: "Label(`traefik.constraint-label`, `traefik-public`)"
  file:
    directory: /etc/traefik/dynamic
    watch: true
entryPoints:
  http:
    address: :80
    transport:
      respondingTimeouts:
        readTimeout: 0
  https:
    address: :443
    transport:
      respondingTimeouts:
        readTimeout: 0
  ssh:
    address: :10122
    transport:
      respondingTimeouts:
        readTimeout: 0
api:
  dashboard: true
log:
  level: ERROR
  format: common
  filePath: /var/log/traefik/traefik.log
accesslog:
  format: common
  filePath: /var/log/traefik/traefik-access.log
  bufferingSize: 100
